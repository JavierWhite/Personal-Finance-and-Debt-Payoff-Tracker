server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:8080"
                  - "http://13.59.30.170:8080"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
          httpclient:
            connect-timeout: 2000
            response-timeout: 8s
          routes:
            - id: user-account-api
              uri: lb://USER-ACCOUNT-SERVICE
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/incomes/**
              filters:
                - StripPrefix=1
            - id: debt-api
              uri: lb://DEBT-SERVICE
              predicates:
                - Path=/api/debts/**
              filters:
                - StripPrefix=1
            - id: savings-api
              uri: lb://SAVINGS-SERVICE
              predicates:
                - Path=/api/savings-goals/**
              filters:
                - StripPrefix=1
            - id: retirement-api
              uri: lb://RETIREMENT-SERVICE
              predicates:
                - Path=/api/retirement-accounts/**
              filters:
                - StripPrefix=1
            - id: analytics-api
              uri: lb://ANALYTICS-SERVICE
              predicates:
                - Path=/api/analytics/**
              filters:
                - StripPrefix=1

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      access: read-only

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${HOSTNAME:${random.value}}:${server.port}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false
