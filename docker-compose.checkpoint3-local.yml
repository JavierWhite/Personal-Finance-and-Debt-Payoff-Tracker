
services:
  activemq:
    image: apache/activemq:6.2.7
    container_name: finance-activemq
    environment:
      ACTIVEMQ_CONNECTION_USER: finance
      ACTIVEMQ_CONNECTION_PASSWORD: finance-demo-password
      ACTIVEMQ_WEB_USER: admin
      ACTIVEMQ_WEB_PASSWORD: admin
    ports:
      - "61616:61616"
      - "127.0.0.1:8161:8161"
    volumes:
      - ./activemq-conf/jetty.xml:/opt/apache-activemq/conf/jetty.xml:ro

  zipkin:
    image: openzipkin/zipkin:3.6.1
    container_name: finance-zipkin
    ports:
      - "9411:9411"

  api-gateway:
    environment:
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      zipkin:
        condition: service_started

  user-account-service:
    environment:
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      zipkin:
        condition: service_started

  debt-service:
    environment:
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      SPRING_ACTIVEMQ_USER: finance
      SPRING_ACTIVEMQ_PASSWORD: finance-demo-password
      DEBT_PAYMENT_QUEUE: finance.debt.payment.recorded
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      activemq:
        condition: service_started
      zipkin:
        condition: service_started

  analytics-service:
    environment:
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      SPRING_ACTIVEMQ_USER: finance
      SPRING_ACTIVEMQ_PASSWORD: finance-demo-password
      DEBT_PAYMENT_QUEUE: finance.debt.payment.recorded
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      activemq:
        condition: service_started
      zipkin:
        condition: service_started

